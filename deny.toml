# cargo-deny: only permissive licences in what we ship; advisories checked in CI.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.9
# cbindgen writes the C header at build time and is never linked into what we ship.
exceptions = [{ allow = ["MPL-2.0"], crate = "cbindgen" }]

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[workspace]
resolver = "3"
members = [
    "crates/stintmate-ipc",
    "crates/stintmate-ipc-check",
    "crates/stintmate-ipc-ffi",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Stintmate-App/stintmate-ipc"
authors = ["The Stintmate authors"]

[workspace.dependencies]
stintmate-ipc = { path = "crates/stintmate-ipc", version = "0.3.0" }
stintmate-ipc-check = { path = "crates/stintmate-ipc-check", version = "0.3.0" }
bytes = "1.12.1"
rmpv = "1.3.1"
thiserror = "2.0.21"
serde_json = "1.0.154"
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.1"
getrandom = "0.4.3"
windows-sys = "0.61.2"
tokio = "1.54.1"
tokio-util = { version = "0.7.20", default-features = false }
tracing = "0.1.44"
crossbeam-channel = "0.5.17"
proptest = "1.12.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "thin"
codegen-units = 1

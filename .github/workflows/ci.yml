name: ci

on:
  push:
    branches: [main, rust]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the wheel (abi3)
        run: uvx maturin build --release --manifest-path python/Cargo.toml --out dist
      - name: Import the wheel
        run: |
          uv venv .venv-ci
          uv pip install --python .venv-ci (Get-ChildItem dist/*.whl).FullName
          .venv-ci/Scripts/python -c "import stintmate_ipc as s; print(s.version(), s.spec_revision())"

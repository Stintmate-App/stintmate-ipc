name: ci

# CI runs by hand only (Actions > ci > Run workflow). The checks are the commands of the README,
# "Building", plus `cargo fmt --all --check`, `cargo clippy --workspace --all-targets -- -D warnings`
# and `cargo deny check licenses advisories bans sources` (needs `cargo-deny`).
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job: every job pays the runner's start.
  ci:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The C ABI DLL the tests use (cargo test does not build cdylibs).
      - run: cargo build --workspace
      - run: cargo test --workspace
      # cargo-deny, from a prebuilt binary.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses advisories bans sources

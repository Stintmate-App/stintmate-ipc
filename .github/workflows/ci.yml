name: ci

# Minutes are limited (free organisation, Windows counts double): CI runs by hand only
# (Actions > ci > Run workflow); every check runs locally before each merge (README, "Building").
# It runs on the organisation's own Windows runner `stintmate-win` (no GitHub minutes; private
# repositories and workflow_dispatch only); `windows-latest` is the fallback when it is down.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run
        type: choice
        options: [stintmate-win, windows-latest]
        default: stintmate-win

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job: every job pays the runner's start, and the runner takes one job at a time.
  ci:
    runs-on: ${{ inputs.runner == 'windows-latest' && 'windows-latest' || fromJSON('["self-hosted", "stintmate-win"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The C ABI DLL the tests use (cargo test does not build cdylibs).
      - run: cargo build --workspace
      - run: cargo test --workspace
      # cargo-deny: installed on stintmate-win; GitHub's runner installs it here.
      - if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses advisories bans sources

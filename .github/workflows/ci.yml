name: ci

# Minutes are limited (free organisation, Windows counts double): CI runs by hand only
# (Actions > ci > Run workflow); every check runs locally before each merge (README, "Building").
# It runs on the organisation's own Windows runner `stintmate-win` (no GitHub minutes; private
# repositories and workflow_dispatch only); `windows-latest` is the fallback when it is down.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to run
        type: choice
        options: [stintmate-win, windows-latest]
        default: stintmate-win

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job: every job pays the runner's start, and the runner takes one job at a time.
  ci:
    runs-on: ${{ inputs.runner == 'windows-latest' && 'windows-latest' || fromJSON('["self-hosted", "stintmate-win"]') }}
    timeout-minutes: 90
    env:
      # The C and C# examples (stintmate-ipc-ffi tests) fail instead of skipping without MSVC/csc.
      STINTMATE_REQUIRE_EXAMPLES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
      # Registry, git checkouts and target only: the runner's rustup proxies in CARGO_HOME\bin are
      # symlinks, which a job without admin cannot recreate on restore (cargo.exe would be lost).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The C ABI DLL the examples link against (cargo test does not build cdylibs).
      - run: cargo build --workspace
      - run: cargo test --workspace
      # cargo-deny: installed on stintmate-win; GitHub's runner installs it here.
      - if: runner.environment == 'github-hosted'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check licenses advisories bans sources
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Build the wheel (abi3)
        run: uvx maturin build --release --manifest-path python/Cargo.toml --out dist
      - name: Import the wheel
        run: |
          uv venv .venv-ci
          uv pip install --python .venv-ci (Get-ChildItem dist/*.whl).FullName
          .venv-ci/Scripts/python -c "import stintmate_ipc as s; print(s.version(), s.spec_revision())"

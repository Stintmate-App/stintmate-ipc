language = "C"
include_guard = "STINTMATE_IPC_H"
pragma_once = true
cpp_compat = true
no_includes = false
sys_includes = ["stddef.h"]
usize_is_size_t = true
style = "type"
header = """/*
 * Stintmate IPC v2: C ABI.
 * Generated by cbindgen from crates/stintmate-ipc-ffi (do not edit).
 * Licensed under the Apache License 2.0.
 */"""

[parse]
parse_deps = false

[export]
include = []

[fn]
must_use = ""

[const]
allow_static_const = false

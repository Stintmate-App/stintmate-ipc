[package]
name = "stintmate-ipc-ffi"
description = "C ABI of Stintmate IPC v2 (for C, C++, C# and other languages)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
name = "stintmate_ipc"
crate-type = ["cdylib", "staticlib"]

[dependencies]
stintmate-ipc.workspace = true
crossbeam-channel.workspace = true

[build-dependencies]
# MPL-2.0, used only at build time to write include/stintmate_ipc.h (never linked).
cbindgen = { version = "0.29.4", default-features = false }

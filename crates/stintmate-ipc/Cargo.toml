[package]
name = "stintmate-ipc"
description = "Stintmate IPC v2: the reference implementation of the protocol (named pipes, MessagePack)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bytes.workspace = true
rmpv.workspace = true
thiserror.workspace = true
serde_json.workspace = true
hmac.workspace = true
sha2.workspace = true
getrandom.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_Pipes"] }

[dev-dependencies]
criterion.workspace = true
hex.workspace = true
proptest.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[[bench]]
name = "codec"
harness = false

[package]
name = "stintmate-ipc-py"
description = "Python binding of Stintmate IPC v2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
stintmate-ipc.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py312", "extension-module"] }
